# Dynamic 3D Gaussians (Luiten et al., 3DV 2024) の物理的正則化つき 4D 学習用
# (frame 2 以降専用)。frame 1 は base.yaml などで密度制御ありで学習した
# チェックポイントを --start-frame 2 --carry-over-checkpoint で受け取る。
#
# warmstart_sweep.yaml からの差分:
#   iterations 1000 -> 2000              (論文の t >= 2 の 1 フレームあたり反復数)
#   position_lr_fixed 1.6e-5 -> 1.6e-4   (論文は位置 LR を減衰させず 1.6e-4 x シーン半径で固定)
#   dynamic_regularization セクションを追加 (重みは論文実装の値)
#
# ADC と opacity reset は無効のまま (近傍グラフがガウシアン集合を固定するため。
# 有効だと train_4d.py が起動時にエラーにする)。
#
# 注意: neighbor_weight_lambda (近傍重み exp(-lambda d^2) の lambda) の 2000 は
# CMU Panoptic のメートル単位のシーンを前提にした値。COLMAP のスケールは
# シーンごとに違うので、近傍距離の典型値 d に対して exp(-lambda d^2) が 0 に
# 潰れていないか確認して調整すること。
runtime:
  device: cuda
  dtype: float32
  seed: 0
data:
  camera_file: camera_poses_blender.json
  resolution_scale: 1.0
  rgba_background: black
  test_every: 8
model:
  sh_degree: 3
  epsilon_q: 1.0e-8
initialization:
  num_gaussians: 100000
  aabb_half_extent: [1.3, 1.3, 1.3]
  initial_rgb: [0.5, 0.5, 0.5]
  neighbor_count: 3
  epsilon_scale: 1.0e-7
  opacity: 0.1
rendering:
  background: [0.0, 0.0, 0.0]
  sigma_extent: 3.0
  epsilon_covariance: 0.3
  epsilon_determinant: 1.0e-8
  alpha_max: 0.99
  alpha_min: 0.00392156862745098
  transmittance_min: 1.0e-4
  tile_based: false
loss:
  lambda_dssim: 0.2
  ssim_window_size: 11
  ssim_sigma: 1.5
  ssim_k1: 0.01
  ssim_k2: 0.03
training:
  iterations: 2000
  views_per_iteration: 1
  optimizer: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-15
  weight_decay: 0.0
  position_lr_initial: 1.6e-4
  position_lr_final: 1.6e-6
  sh_dc_lr: 2.5e-3
  sh_rest_lr: 1.25e-4
  opacity_lr: 5.0e-2
  scale_lr: 5.0e-3
  quaternion_lr: 1.0e-3
  log_interval: 100
  evaluation_interval: 30000
  checkpoint_interval: 1000000
  save_best_by: mean_psnr
density_control:
  densify_from_iteration: 500
  densify_until_iteration: 15000
  densification_interval: 100
  position_gradient_threshold: 0.0002
  percent_dense: 0.01
  prune_opacity_threshold: 0.005
  opacity_reset_interval: 3000
  opacity_reset_maximum: 0.01
  prune_screen_radius_threshold: 20.0
  prune_world_scale_fraction: 0.1
output:
  exist_policy: error
  save_rendered_images: false
features:
  adaptive_density_control: false
  opacity_reset: false
  progressive_sh_degree: false
  resolution_warmup: false
  random_initial_sh_dc: false
warm_start:
  position_lr_mode: fixed
  position_lr_fixed: 1.6e-4
  adam_state: reset
dynamic_regularization:
  enabled: true
  num_neighbors: 20
  neighbor_weight_lambda: 2000.0
  lambda_rigid: 4.0
  lambda_rotation: 4.0
  lambda_isometry: 2.0
  lambda_color: 0.01
  velocity_initialization: true
  freeze_opacity_and_scale: true
