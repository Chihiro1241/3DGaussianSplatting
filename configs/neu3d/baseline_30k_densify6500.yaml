# 30,000 iter だが ADC 窓だけを 7k と同じ 6,500 で止める検証用設定。
# baseline_30k.yaml からの差分: densify_until_iteration 15000 -> 6500 のみ。
#
# 目的: cook_spinach / coffee_martini の双方で 30k の test PSNR が 7k に負ける
# (cook 28.72 dB < 30.90 dB, coffee 21.69 dB < 23.61 dB) 原因の切り分け。
# 30k だけが持つ iter 6,500..14,900 の追加密度化 (85 イベント) と追加の
# 不透明度リセット 2 回 (9,000 / 12,000) を取り除き、最適化の長さだけを
# 7k より長くしたアームになる。
# この設定では密度制御イベント 59 回・不透明度リセット 2 回で baseline_7k と
# 完全に一致し、違いは ADC 終了後の純最適化が 500 iter か 23,500 iter かだけ。
runtime:
  device: cuda
  dtype: float32
  seed: 0
data:
  camera_file: camera_poses_blender.json
  resolution_scale: 1.0
  rgba_background: black
  test_every: 8
model:
  sh_degree: 3
  epsilon_q: 1.0e-8
initialization:
  num_gaussians: 100000
  aabb_half_extent: [1.3, 1.3, 1.3]
  initial_rgb: [0.5, 0.5, 0.5]
  neighbor_count: 3
  epsilon_scale: 1.0e-7
  opacity: 0.1
rendering:
  background: [0.0, 0.0, 0.0]
  sigma_extent: 3.0
  epsilon_covariance: 0.3
  epsilon_determinant: 1.0e-8
  alpha_max: 0.99
  alpha_min: 0.00392156862745098
  transmittance_min: 1.0e-4
  tile_based: false
loss:
  lambda_dssim: 0.2
  ssim_window_size: 11
  ssim_sigma: 1.5
  ssim_k1: 0.01
  ssim_k2: 0.03
training:
  iterations: 30000
  views_per_iteration: 1
  optimizer: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-15
  weight_decay: 0.0
  position_lr_initial: 1.6e-4
  position_lr_final: 1.6e-6
  sh_dc_lr: 2.5e-3
  sh_rest_lr: 1.25e-4
  opacity_lr: 5.0e-2
  scale_lr: 5.0e-3
  quaternion_lr: 1.0e-3
  log_interval: 100
  evaluation_interval: 30000
  checkpoint_interval: 30000
  save_best_by: mean_psnr
density_control:
  densify_from_iteration: 500
  densify_until_iteration: 6500
  densification_interval: 100
  position_gradient_threshold: 0.0002
  percent_dense: 0.01
  prune_opacity_threshold: 0.005
  opacity_reset_interval: 3000
  opacity_reset_maximum: 0.01
  prune_screen_radius_threshold: 20.0
  prune_world_scale_fraction: 0.1
output:
  exist_policy: error
  save_rendered_images: false
features:
  adaptive_density_control: true
  opacity_reset: true
  progressive_sh_degree: true
  resolution_warmup: true
  random_initial_sh_dc: false
