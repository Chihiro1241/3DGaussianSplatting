[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-splatting-reference"
version = "0.1.0"
description = "PyTorch reference implementation of 3D Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4,<2.7",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "plyfile>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: CPU-intensive integration tests",
  "data: tests requiring the ignored local data directory",
]

